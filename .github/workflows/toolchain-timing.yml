name: Toolchain timing
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "e570e0fe5eca86ffedcb61fe93d3cf0160117269"
          path: before
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.6.0"
      - name: Measure both checkouts on this runner (install excluded)
        shell: bash
        run: |
          failure=0
          for phase in before after; do
            cd "$GITHUB_WORKSPACE/$phase"
            pnpm install --frozen-lockfile
            for task in typecheck dashboard:build; do
              if /usr/bin/time -f "$phase $task %e seconds" -o "$RUNNER_TEMP/$phase-$task.txt" pnpm run "$task"; then
                cat "$RUNNER_TEMP/$phase-$task.txt" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                cat "$RUNNER_TEMP/$phase-$task.txt" | tee -a "$GITHUB_STEP_SUMMARY"
                failure=1
              fi
            done
          done
          exit "$failure"
